name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --extra charts
      - name: Run offline tests
        run: uv run --locked --extra charts python -m unittest discover -s tests -v
      - name: Build package
        run: uv build
      - name: Check installed commands and synthetic MCP query
        run: uv run --locked --extra charts python scripts/smoke_installed.py --charts
