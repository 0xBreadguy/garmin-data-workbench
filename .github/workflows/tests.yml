name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# New commits replace obsolete PR checks; main pushes retain their own smoke run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --extra charts
      - name: Run offline tests
        run: uv run --locked --extra charts python -m unittest discover -s tests -v --durations 10
      - name: Build package
        run: uv build
      - name: Check installed commands and synthetic MCP query
        run: uv run --locked --extra charts python scripts/smoke_installed.py --charts
      - name: Check installed commands without chart dependencies
        if: runner.os == 'Linux'
        run: uv run --locked --extra charts python scripts/smoke_installed.py

  post_merge:
    name: Post-merge package smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --extra charts
      - name: Build package
        run: uv build
      - name: Check installed commands and synthetic MCP query
        run: uv run --locked --extra charts python scripts/smoke_installed.py --charts
      - name: Check installed commands without chart dependencies
        run: uv run --locked --extra charts python scripts/smoke_installed.py
