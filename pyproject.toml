[project]
name = "garmin-extraction"
version = "0.1.0"
description = "Local tools for accessing your own Garmin data"
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0,<2",
    "garmin-fit-sdk>=21.0.0",
    "requests>=2.31,<3",
]

[project.scripts]
garmin-archive = "garmin_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_archive"]
