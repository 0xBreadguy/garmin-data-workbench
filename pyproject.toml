[project]
name = "garmin-data-workbench"
version = "0.1.0"
description = "A local-first, open-source workbench for your Garmin health and activity data"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16,<5",
    "garmin-connect-personal-api-python>=1.0.0,<2",
    "garmin-fit-sdk>=21.0.0",
    "mcp>=1.30,<2",
    "requests>=2.31,<3",
    "tzdata>=2025.2",
]

[project.scripts]
garmin-archive = "garmin_archive.cli:main"
garmin-archive-mcp = "garmin_archive.mcp_server:main"

[project.optional-dependencies]
charts = [
    "matplotlib>=3.9,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_archive"]

[tool.hatch.build.targets.wheel.force-include]
"assets/logo.svg" = "garmin_archive/brand_assets/logo.svg"
"assets/icon.svg" = "garmin_archive/brand_assets/icon.svg"
"assets/icon.png" = "garmin_archive/brand_assets/icon.png"
